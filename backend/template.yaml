AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Fitcheck Backend API

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

Globals:
  Function:
    Runtime: python3.9
    Timeout: 10
    MemorySize: 512
    Environment:
      Variables:
        TABLE_NAME: !Ref AppDataTable
        BUCKET_NAME: !Ref UserAssetsBucket
        COGNITO_USER_POOL_ID: !Ref UserPool
        ENVIRONMENT: !Ref Environment

Resources:
  # Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub fitcheck-users-${Environment}
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub fitcheck-client-${Environment}
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      CallbackURLs:
        - http://localhost:3000/callback
        - https://fitcheck.app/callback
      LogoutURLs:
        - http://localhost:3000
        - https://fitcheck.app
      SupportedIdentityProviders:
        - COGNITO

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub fitcheck-${Environment}-${AWS::AccountId}
      UserPoolId: !Ref UserPool

  # DynamoDB Table
  AppDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub fitcheck-data-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # S3 Bucket for User Assets
  UserAssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub fitcheck-user-assets-${Environment}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - PUT
              - GET
            AllowedHeaders:
              - '*'
            MaxAge: 3000

  # API Gateway
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub fitcheck-api-${Environment}
      StageName: !Ref Environment
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        MaxAge: "'86400'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  # Lambda Functions
  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fitcheck-upload-url-${Environment}
      CodeUri: src/
      Handler: handlers.upload_url.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref UserAssetsBucket
      Events:
        GetUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /upload-url
            Method: GET
        OptionsUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /upload-url
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fitcheck-profile-${Environment}
      CodeUri: src/
      Handler: handlers.profile.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppDataTable
      Events:
        PostProfile:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /profile
            Method: POST
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /profile
            Method: GET
        OptionsProfile:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /profile
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  CartFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fitcheck-cart-${Environment}
      CodeUri: src/
      Handler: handlers.cart.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppDataTable
      Events:
        PostCart:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /cart
            Method: POST
        GetCart:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /cart
            Method: GET
        DeleteCart:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /cart
            Method: DELETE
        OptionsCart:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /cart
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  FitFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fitcheck-fit-${Environment}
      CodeUri: src/
      Handler: handlers.fit.handler
      Timeout: 30
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppDataTable
        - S3CrudPolicy:
            BucketName: !Ref UserAssetsBucket
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      Events:
        PostFit:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /fit
            Method: POST
        OptionsFit:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /fit
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        GetFit:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /fit/{fitId}
            Method: GET
        OptionsGetFit:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /fit/{fitId}
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  FitsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fitcheck-fits-${Environment}
      CodeUri: src/
      Handler: handlers.fits.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppDataTable
        - S3ReadPolicy:
            BucketName: !Ref UserAssetsBucket
      Events:
        GetFits:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /fits
            Method: GET

  TokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fitcheck-token-${Environment}
      CodeUri: src/
      Handler: handlers.token.handler
      Environment:
        Variables:
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          COGNITO_DOMAIN: !Sub https://fitcheck-${Environment}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com
      Events:
        PostToken:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /token
            Method: POST
            Auth:
              Authorizer: NONE

  MultiFitFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fitcheck-multi-fit-${Environment}
      CodeUri: src/
      Handler: handlers.multi_fit.handler
      Timeout: 300  # 5 minutes for multi-step processing
      MemorySize: 2048  # More memory for multiple Bedrock calls
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppDataTable
        - S3CrudPolicy:
            BucketName: !Ref UserAssetsBucket
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      Events:
        PostMultiFit:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /multi-fit
            Method: POST
        GetMultiFit:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /multi-fit
            Method: GET
        OptionsMultiFit:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /multi-fit
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  UserAssetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fitcheck-user-assets-${Environment}
      CodeUri: src/
      Handler: handlers.user_assets.handler
      Timeout: 30
      MemorySize: 512
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref UserAssetsBucket
      Events:
        GetUserAssets:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /user-assets
            Method: GET
        OptionsUserAssets:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /user-assets
            Method: OPTIONS
            Auth:
              Authorizer: NONE

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient

  UserPoolDomain:
    Description: Cognito User Pool Domain
    Value: !Sub https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com

  BucketName:
    Description: S3 Bucket Name
    Value: !Ref UserAssetsBucket

  TableName:
    Description: DynamoDB Table Name
    Value: !Ref AppDataTable
